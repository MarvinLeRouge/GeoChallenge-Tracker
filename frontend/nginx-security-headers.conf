# frontend/nginx-security-headers.conf
# Shared security headers, included in every `location` block that defines its
# own `add_header` (Cache-Control, Vary, etc.). nginx does NOT inherit `add_header`
# from a parent context once a block sets any of its own - so declaring these only
# at the `server` level would silently never reach a real response.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Prod is always served over HTTPS via Traefik/Let's Encrypt; this file is only used
# by the prod nginx image (dev runs the Vite dev server directly, never this config).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# No external scripts/styles/fonts/connections: everything is bundled by Vite and
# served same-origin (API/tiles routed by Traefik under the same domain). data: is
# required for img-src: map markers are inline SVG data URIs (see markerFactory.ts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

[project]
name = "geochallenge-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "motor>=3.7.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "selectolax>=1.0.2",
    "shapely>=2.2.0",
    "slowapi>=0.1.10",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "packaging>=26.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.5",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.4",
]

[tool.mypy]
python_version = "3.14"
show_error_context = true
show_column_numbers = true
strict_optional = true
plugins = ["pydantic.mypy"]
exclude = ["test-scripts/"]

[[tool.mypy.overrides]]
module = "selectolax.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shapely.*", "requests.*", "yaml.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]


[project]
name = "geochallenge-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=5.1.2",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "motor>=3.7.1",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "selectolax>=0.3.34",
    "shapely>=2.1.2",
    "slowapi>=0.1.10",
    "starlette>=1.3.1",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.14.1",
    "packaging>=25.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.1.5",
    "pytest-mock>=3.12.0",
    "ruff>=0.13.1",
]

[tool.mypy]
python_version = "3.11"
show_error_context = true
show_column_numbers = true
strict_optional = true
plugins = ["pydantic.mypy"]
exclude = ["test-scripts/"]

[[tool.mypy.overrides]]
module = "selectolax.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shapely.*", "requests.*", "yaml.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]


name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "docs/**"
      - "**.md"

jobs:
  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Ruff check
        run: ruff check backend/

      - name: Ruff format
        run: ruff format --check backend/

      - name: Mypy
        run: mypy backend/

  backend-test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      MONGODB_USER: ci
      MONGODB_PASSWORD: ci
      MONGODB_URI_TPL: "mongodb://localhost:27017"
      MONGODB_DB: geochallenge_ci
      JWT_SECRET_KEY: ci-test-secret-key-for-unit-tests-only
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password
      MAIL_FROM: ci@ci.local
      ADMIN_TEST_EMAIL: ci@ci.local
      SMTP_HOST: localhost
      SMTP_PORT: 25
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      ELEVATION_PROVIDER: open-elevation
      ELEVATION_PROVIDER_ENDPOINT: http://localhost:8080
      ELEVATION_PROVIDER_MAX_POINTS_PER_REQ: 100
      ELEVATION_PROVIDER_RATE_DELAY_S: 1
      ELEVATION_ENABLED: false
      ONE_MB: 1048576
      MAX_UPLOAD_MB: 50
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run unit tests with coverage
        working-directory: backend
        run: pytest tests/unit/ --cov=app --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          use_oidc: true

  backend-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: pip-audit (dependency vulnerability scan)
        working-directory: backend
        run: |
          # PYSEC-2026-1325 (ecdsa): Minerva timing attack, no upstream fix. Not exploitable
          # here since this project only signs JWTs with HS256, never an ECDSA-based algorithm.
          # Re-verified on every run: if an ECDSA algorithm or direct ecdsa usage shows up in
          # app/, the exception is dropped and pip-audit blocks on it like any other finding.
          if grep -rqE "ES256|ES384|ES512|ecdsa\.(SigningKey|VerifyingKey|SECP256k1|NIST256p)" app/; then
            echo "::error::ECDSA-related JWT algorithm or direct ecdsa usage detected in app/ - the ecdsa vulnerability exception (PYSEC-2026-1325) no longer applies."
            pip-audit -r requirements.txt -r requirements-dev.txt
          else
            pip-audit -r requirements.txt -r requirements-dev.txt --ignore-vuln PYSEC-2026-1325
          fi

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (dependency vulnerability scan)
        # Reports every finding, but only fails the build on critical severity.
        run: npm audit --audit-level=critical

  frontend-unit:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          use_oidc: true

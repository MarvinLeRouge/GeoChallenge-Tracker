name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: ["main"]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'eslint.config.js'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'postcss.config.cjs'
              - 'vitest.config.ts'
              - 'vitest.shims.d.ts'
              - 'playwright.config.ts'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: "Backend: lint"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy
        working-directory: backend
        run: uv run mypy .

  backend-test:
    name: "Backend: test"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      MONGODB_USER: ci
      MONGODB_PASSWORD: ci
      MONGODB_URI_TPL: "mongodb://localhost:27017"
      MONGODB_DB: geochallenge_ci
      JWT_SECRET_KEY: ci-test-secret-key-for-unit-tests-only
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password
      MAIL_FROM: ci@ci.local
      ADMIN_TEST_EMAIL: ci@ci.local
      SMTP_HOST: localhost
      SMTP_PORT: 25
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      ELEVATION_PROVIDER: open-elevation
      ELEVATION_PROVIDER_ENDPOINT: http://localhost:8080
      ELEVATION_PROVIDER_MAX_POINTS_PER_REQ: 100
      ELEVATION_PROVIDER_RATE_DELAY_S: 1
      ELEVATION_ENABLED: false
      ONE_MB: 1048576
      MAX_UPLOAD_MB: 50
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run unit tests with coverage
        working-directory: backend
        run: uv run pytest tests/unit/ --cov=app --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          use_oidc: true

  backend-security:
    name: "Backend: security"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend

      - name: pip-audit (dependency vulnerability scan)
        working-directory: backend
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt

  frontend-lint:
    name: "Frontend: lint"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend-security:
    name: "Frontend: security"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (dependency vulnerability scan)
        run: npm audit --audit-level=critical

  frontend-test:
    name: "Frontend: test"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          use_oidc: true

  ci-status:
    name: CI status
    if: always()
    needs: [changes, backend-lint, backend-test, backend-security, frontend-lint, frontend-security, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

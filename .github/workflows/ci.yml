name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: ["main"]
  # Dispatched by changelog.yml on its bot PR: events created with GITHUB_TOKEN do not
  # trigger pull_request runs, but workflow_dispatch is exempt from that rule
  workflow_dispatch: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'eslint.config.js'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'postcss.config.cjs'
              - 'vitest.config.ts'
              - 'vitest.shims.d.ts'
              - 'playwright.config.ts'
              # error-messages.spec.ts checks every backend ErrorCode has a French message
              - 'backend/app/core/errors.py'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: "Backend: lint"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy
        working-directory: backend
        run: uv run mypy .

  backend-test:
    name: "Backend: test"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      MONGODB_USER: ci
      MONGODB_PASSWORD: ci
      MONGODB_URI_TPL: "mongodb://localhost:27017"
      MONGODB_DB: geochallenge_ci
      JWT_SECRET_KEY: ci-test-secret-key-for-unit-tests-only
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password
      MAIL_FROM: ci@ci.local
      ADMIN_TEST_EMAIL: ci@ci.local
      SMTP_HOST: localhost
      SMTP_PORT: 25
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      ELEVATION_PROVIDER: open-elevation
      ELEVATION_PROVIDER_ENDPOINT: http://localhost:8080
      ELEVATION_PROVIDER_MAX_POINTS_PER_REQ: 100
      ELEVATION_PROVIDER_RATE_DELAY_S: 1
      ELEVATION_ENABLED: false
      ONE_MB: 1048576
      MAX_UPLOAD_MB: 50
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run unit tests with coverage
        working-directory: backend
        run: uv run pytest tests/unit/ --cov=app --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          use_oidc: true

  backend-integration:
    name: "Backend: integration"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_USER: ci
      MONGODB_PASSWORD: ci
      MONGODB_URI_TPL: "mongodb://localhost:27017"
      MONGODB_DB: geochallenge_ci_TEST
      TEST_MODE: "true"
      JWT_SECRET_KEY: ci-test-secret-key-for-unit-tests-only
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password
      MAIL_FROM: ci@ci.local
      ADMIN_TEST_EMAIL: ci@ci.local
      SMTP_HOST: localhost
      SMTP_PORT: 25
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      ELEVATION_PROVIDER: open-elevation
      ELEVATION_PROVIDER_ENDPOINT: http://localhost:8080
      ELEVATION_PROVIDER_MAX_POINTS_PER_REQ: 100
      ELEVATION_PROVIDER_RATE_DELAY_S: 1
      ELEVATION_ENABLED: false
      ONE_MB: 1048576
      MAX_UPLOAD_MB: 50
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Seed referentials and indexes
        working-directory: backend
        run: |
          uv run python -m app.db.seed_data
          uv run python scripts/backfill_country_codes.py

      - name: Run integration tests
        working-directory: backend
        run: uv run pytest tests/integration -q -rfEX

  backend-security:
    name: "Backend: security"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend

      - name: pip-audit (dependency vulnerability scan)
        working-directory: backend
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/req.txt
          # The export is fully pinned, so pip-audit needs no resolver venv (its ensurepip
          # fails on uv-managed Pythons). uvx picks .python-version, so markers match prod.
          uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip

  frontend-lint:
    name: "Frontend: lint"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend-security:
    name: "Frontend: security"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (dependency vulnerability scan)
        run: npm audit --audit-level=critical

  frontend-test:
    name: "Frontend: test"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          use_oidc: true

  frontend-e2e:
    name: "Frontend: e2e"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    # The specs stub every API call (page.route), so no backend or database is needed
    env:
      CI: "true"
      ADMIN_USERNAME: e2e-user
      ADMIN_PASSWORD: e2e-password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  ci-status:
    name: CI status
    if: always()
    needs: [changes, backend-lint, backend-test, backend-integration, backend-security, frontend-lint, frontend-security, frontend-test, frontend-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

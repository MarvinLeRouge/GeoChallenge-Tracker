name: Build, Push & Deploy

on:
  # Triggered automatically when CI passes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger: bypasses CI gate (hotfixes, rollbacks, redeploys)
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# One deploy at a time: two merges close together would otherwise run two `docker compose up`
# on the VPS at once and remove each other's containers. A newer run waits (and replaces any
# run already waiting) instead of cancelling the one in progress.
concurrency:
  group: build-push-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: build the Docker images (backend, frontend) and push them to GHCR. Build and
  # push are one build-push-action step (push: true): a separate push job would
  # have to move the images between runners.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    # On workflow_run: only proceed if CI succeeded
    # On workflow_dispatch: always proceed
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      head_sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Resolve commit SHA
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=sha-${SHA::7}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/marvinlerouge/geochallenge-tracker/backend:${{ steps.meta.outputs.tag }}
            ghcr.io/marvinlerouge/geochallenge-tracker/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
          tags: |
            ghcr.io/marvinlerouge/geochallenge-tracker/frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/marvinlerouge/geochallenge-tracker/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: deploy the images pushed by job 1 to production over SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GITHUB_SHA: ${{ needs.build-and-push.outputs.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_PATH: /home/mlr/marvinlerouge.dev/gc-tracker/compose
          SHARED_PATH: /home/mlr/marvinlerouge.dev/gc-tracker/shared
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,GITHUB_SHA,GITHUB_REPOSITORY,DEPLOY_PATH,SHARED_PATH
          script_stop: true
          script: |
            set -Eeuo pipefail

            echo "==> Authenticate to GHCR"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            REPO_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
            REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"

            echo "==> Fetch docker-compose.prod.yml (commit: ${GITHUB_SHA})"
            curl -fsSL "${REPO_URL}/docker-compose.prod.yml" \
              -o "${DEPLOY_PATH}/docker-compose.yml"

            echo "==> Fetch nginx config files"
            mkdir -p "${SHARED_PATH}/ops/nginx/www/tiles" "${SHARED_PATH}/env"
            curl -fsSL "${REPO_URL}/ops/nginx/tiles.conf" \
              -o "${SHARED_PATH}/ops/nginx/tiles.conf"
            curl -fsSL "${REPO_URL}/ops/nginx/www/tiles/_health.png" \
              -o "${SHARED_PATH}/ops/nginx/www/tiles/_health.png"

            cd "${DEPLOY_PATH}"

            # every compose command below needs them, the compose file has no other source
            export IMAGE_BACKEND="${REGISTRY}/backend:${IMAGE_TAG}"
            export IMAGE_FRONTEND="${REGISTRY}/frontend:${IMAGE_TAG}"

            echo "==> Pull images (tag: ${IMAGE_TAG})"
            docker compose pull

            echo "==> Redeploy stack"
            docker compose up -d --remove-orphans

            echo "==> Stack status"
            docker compose ps
